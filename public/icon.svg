<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="128" fill="#8a4824" />
  <!-- Open Book & Sprout Icon -->
  <g fill="none" stroke="#f8f6f0" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" transform="translate(106, 126)">
    <!-- Book Pages -->
    <path d="M 0 60 C 50 40 100 40 150 60 L 150 250 C 100 230 50 230 0 250 Z" fill="#ffffff" fill-opacity="0.12" />
    <path d="M 300 60 C 250 40 200 40 150 60 L 150 250 C 200 230 250 230 300 250 Z" fill="#ffffff" fill-opacity="0.12" />
    <!-- Leaf Sprout Growing From Spine -->
    <path d="M 150 60 Q 150 0 100 -20 Q 140 10 150 60" fill="#f8f6f0" stroke="none" />
    <path d="M 150 35 Q 160 -10 200 -25 Q 170 10 150 35" fill="#f8f6f0" stroke="none" />
    <!-- Page Lines -->
    <line x1="30" y1="110" x2="120" y2="110" stroke="#f8f6f0" stroke-width="18" />
    <line x1="30" y1="150" x2="120" y2="150" stroke="#f8f6f0" stroke-width="18" />
    <line x1="30" y1="190" x2="90" y2="190" stroke="#f8f6f0" stroke-width="18" />
    <line x1="180" y1="110" x2="270" y2="110" stroke="#f8f6f0" stroke-width="18" />
    <line x1="180" y1="150" x2="270" y2="150" stroke="#f8f6f0" stroke-width="18" />
    <line x1="210" y1="190" x2="270" y2="190" stroke="#f8f6f0" stroke-width="18" />
  </g>
</svg>
